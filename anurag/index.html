<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anurag Jha · Wildbook</title>
    <meta
      name="description"
      content="Anurag Jha — Founder, Wildbook. Digital business card."
    />
    <meta property="og:title" content="Anurag Jha · Founder, Wildbook" />
    <meta property="og:description" content="Get in touch with Anurag Jha at Wildbook." />
    <meta property="og:image" content="assets/photo.png" />
    <meta name="theme-color" content="#002023" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Nunito:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="card.js" defer></script>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="card">
      <header class="hero">
        <div class="photo-wrap">
          <img
            class="photo"
            src="assets/photo.png"
            alt="Anurag Jha"
            width="480"
            height="600"
          />
        </div>
        <div class="identity">
          <p class="brand">Wildbook</p>
          <h1>Anurag Jha</h1>
          <p class="role">Founder</p>
        </div>
      </header>

      <section class="links" aria-label="Contact">
        <div class="contact-row">
          <a class="link" href="tel:+917483735393">
            <span class="link-label">Phone</span>
            <span class="link-value">+91 74837 35393</span>
          </a>
          <button
            type="button"
            class="copy-btn"
            data-copy="+91 74837 35393"
            aria-label="Copy phone number"
          >
            Copy
          </button>
        </div>

        <div class="contact-row">
          <a class="link" href="mailto:hello@wildbook.in">
            <span class="link-label">Email</span>
            <span class="link-value">hello@wildbook.in</span>
          </a>
          <button
            type="button"
            class="copy-btn"
            data-copy="hello@wildbook.in"
            aria-label="Copy email"
          >
            Copy
          </button>
        </div>

        <div class="contact-row">
          <a
            class="link"
            href="https://www.wildbook.in"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-label">Website</span>
            <span class="link-value">www.wildbook.in</span>
          </a>
          <button
            type="button"
            class="copy-btn"
            data-copy="https://www.wildbook.in"
            aria-label="Copy website"
          >
            Copy
          </button>
        </div>

        <div class="contact-row">
          <a
            class="link"
            href="https://www.instagram.com/wildbook.in"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-label">Instagram</span>
            <span class="link-value">@wildbook.in</span>
          </a>
          <button
            type="button"
            class="copy-btn"
            data-copy="@wildbook.in"
            aria-label="Copy Instagram"
          >
            Copy
          </button>
        </div>
      </section>

      <section class="actions">
        <button type="button" class="btn btn-primary" id="save-contact">
          Save contact
        </button>
      </section>
    </main>
  </body>
</html>
